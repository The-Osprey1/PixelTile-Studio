[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixeltile-studio"
dynamic = ["version"]
description = "Turn images into multicolor, face-down 3D-printable wall-art tiles as pre-colored Bambu Studio .3mf files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=9.1",
]

[project.optional-dependencies]
desktop = ["pywebview>=4.0"]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8.0"]

[project.scripts]
pixeltile = "pixeltile.cli:main"

[tool.setuptools]
packages = ["pixeltile"]

[tool.setuptools.package-data]
pixeltile = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "pixeltile.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
